version: '3.8'

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Selva@RaJ1234
    ports:
      - "1433:1433"

  api:
    build: .
    container_name: ssproject-api
    depends_on:
      - sql
    ports:
      - "8081:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sql;Database=SSManagement;User Id=sa;Password=Selva@RaJ1234;Encrypt=False;

      - PdfSettings__SavePath=/app/outputs/dc

    volumes:
      - ./dc_outputs:/app/outputs/dc